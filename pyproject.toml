[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cogprime"
version = "0.1.0"
description = "An Integrated AGI Architecture combining OpenCog, Hyperon, and Vervaeke's Relevance Realization"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [
    {name = "CogPy Team", email = "d@rzo.io"}
]
maintainers = [
    {name = "CogPy Team", email = "d@rzo.io"}
]
keywords = [
    "agi",
    "artificial-intelligence",
    "cognitive-architecture",
    "opencog",
    "relevance-realization",
    "silicon-sage"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "numpy>=1.20.0",
    "torch>=2.0.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
    "networkx>=3.0",
    "protobuf>=4.21.0",
    "grpcio>=1.50.0",
    "grpcio-tools>=1.50.0",
    "qdrant-client>=1.9.1",
    "pydantic>=2.7.3",
    "posthog>=3.5.0",
    "pytz>=2024.1",
    "sqlalchemy>=2.0.31",
    "langchain>=0.0.267",
    "langchain-community>=0.3.1",
    "rank-bm25>=0.2.2",
    "chromadb>=0.4.13",
    "pinecone-client>=2.2.2",
    "pymilvus>=2.3.0",
    "redis>=4.6.0",
    "pgvector>=0.2.0",
    "neo4j>=5.23.1",
    "py2neo>=2021.2.3",
    "openai>=1.33.0",
    "anthropic>=0.5.0",
    "google-generativeai>=0.3.0",
    "cohere>=4.27",
    "transformers>=4.30.0",
    "tiktoken>=0.5.1",
    "litellm>=0.1.1",
    "sentence-transformers>=2.2.2",
    "fasttext>=0.9.2",
    "cffi>=1.15.0",
    "pybind11>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.1",
    "pytest-cov>=4.1.0",
    "black>=23.3.0",
    "isort>=5.12.0",
    "mypy>=1.3.0",
    "ruff>=0.0.270",
    "pre-commit>=3.3.2",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "nbsphinx>=0.9.2",
]
graph = [
    "langchain-community>=0.3.1",
    "neo4j>=5.23.1",
    "rank-bm25>=0.2.2",
]

[project.urls]
Homepage = "https://github.com/cogpy/cogprime"
Documentation = "https://github.com/cogpy/cogprime/blob/main/README.md"
Repository = "https://github.com/cogpy/cogprime"
Issues = "https://github.com/cogpy/cogprime/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
namespaces = false

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | integrations
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
extend_skip = ["integrations"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "integrations/",
    "build/",
    "dist/",
]

[tool.ruff]
line-length = 100
target-version = "py38"
extend-exclude = [
    "integrations",
    "build",
    "dist",
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=term-missing"
