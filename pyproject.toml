[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cogprime"
version = "1.0.0"
description = "An Integrated AGI Architecture combining OpenCog Prime, Hyperon, and Vervaeke's Relevance Realization"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "CogPrime Development Team", email = "dev@cogprime.org"}
]
keywords = ["agi", "opencog", "cognitive-architecture", "relevance-realization", "artificial-general-intelligence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "numpy>=1.20.0",
    "torch>=2.0.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
    "networkx>=3.0",
    "protobuf>=4.21.0",
    "grpcio>=1.50.0",
    "grpcio-tools>=1.50.0",
    "mem0ai>=0.1.0",
    "langchain>=0.0.267",
    "langchain-community>=0.0.10",
    "rank-bm25>=0.2.2",
    "chromadb>=0.4.13",
    "qdrant-client>=1.3.1",
    "redis>=4.6.0",
    "neo4j>=5.9.0",
    "openai>=1.3.0",
    "transformers>=4.30.0",
    "tiktoken>=0.5.1",
    "sentence-transformers>=2.2.2",
    "cffi>=1.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.1",
    "pytest-cov>=4.1.0",
    "black>=23.3.0",
    "isort>=5.12.0",
    "mypy>=1.3.0",
    "ruff>=0.0.270",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/cogpy/cogprime"
Documentation = "https://github.com/cogpy/cogprime/tree/main/docs"
Repository = "https://github.com/cogpy/cogprime"
"Bug Tracker" = "https://github.com/cogpy/cogprime/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.pytest.ini_options]
testpaths = ["src/tests", "test_*.py"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
