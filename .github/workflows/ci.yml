name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v3

    - name: Set up C++
      uses: actions/setup-gpp@v1

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.x'

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Build C++ Unit Tests
      run: |
        g++ tests/unit/test_core.cpp -I include -o test_core
        g++ tests/unit/test_prime.cpp -I include -o test_prime

    - name: Run C++ Unit Tests
      run: |
        ./test_core
        ./test_prime

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        # No requirements.txt for now, but good practice to have
        # if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Python Unit Tests
      run: python tests/unit/test_bindings.py

    - name: Run E2E Tests
      run: bash tests/e2e/test_e2e.sh
      shell: bash

